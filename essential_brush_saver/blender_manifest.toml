schema_version = "1.0.0"

id = "essential_brush_saver"
version = "1.1.3"
name = "Essential Brush Saver"
tagline = "Automatically save and load essential brush settings"
maintainer = "emptybraces <motose6@gmail.com>"
type = "add-on"

# Optional link to documentation, support, source files, etc
website = "https://emptybraces.github.io"

# Optional list defined by Blender and server, see:
# https://docs.blender.org/manual/en/dev/advanced/extensions/tags.html
tags = ["Paint", "Sculpt", "System"]

blender_version_min = "4.3.0"
## Optional: Blender version that the extension does not support, earlier versions are supported.
## This can be omitted and defined later on the extensions platform if an issue is found.
# blender_version_max = "5.1.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

[permissions]
files = "Save/Load configuration data JSON file to/from disk"


# ---------------------------
# v1.1.3
# - [Fix] オブジェクトを何も選択してないときに保存するとエラーが発生し処理が中断される。
# - [Fix] Dyntopoのリストアが正常に働かないケースがある。
# v1.1.2
# - プリファレンスからブラシデータを個別削除できるようにした。
# - [Fix] スカルプトモード時にDyntopoにチェックが入っている状態で保存したりロードすると必ずチェックが外れる。
# v1.1.1
# - ブラシ保存データないときロード処理を行わないようにする
# v1.1.0
# - ロード回数を少なくすることによるパフォーマンス改善
# - ブラシプロパティを型に基づいて自動取得するように修正
# v1.0.0
# - First release.
